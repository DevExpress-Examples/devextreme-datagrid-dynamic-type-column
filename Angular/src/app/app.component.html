<dx-data-grid
  [dataSource]="sampleData"
  keyExpr="ID"
  [showBorders]="true"
  (onInitNewRow)="onInitNewRow($event)"
>
  <dxo-data-grid-editing
    mode="form"
    [allowUpdating]="true"
    [allowAdding]="true"
  ></dxo-data-grid-editing>
  <dxi-data-grid-column
    dataField="ID"
    [allowEditing]="false"
  ></dxi-data-grid-column>
  <dxi-data-grid-column
    dataField="DynamicValue"
    dataType="object"
    [calculateDisplayValue]="getDynamicDisplayText"
    editCellTemplate="editCellTemplate"
  >
  </dxi-data-grid-column>
  <dxi-data-grid-column dataField="Type" [setCellValue]="setCellValue">
    <dxo-data-grid-lookup [dataSource]="typeList"></dxo-data-grid-lookup>
  </dxi-data-grid-column>
  <div *dxTemplate="let data of 'editCellTemplate'">
    <dynamic-edit-component [cellInfo]="data"></dynamic-edit-component>
  </div>
</dx-data-grid>
